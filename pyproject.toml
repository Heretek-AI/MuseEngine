[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "museengine"
version = "0.2.0"
description = "Structured cross-domain ideation for LLM agents, with adversarial critique, durable memory, and a governed autonomous loop."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
museengine = "museengine.__main__:main"

[tool.setuptools]
packages = ["museengine"]

[tool.setuptools.package-data]
museengine = ["archetypes.json"]
